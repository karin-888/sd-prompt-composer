  - name: 【画像生成AI】ワンピースプロンプト大全｜柄・素材・シルエット236例
    groups:
    - name: シルエット / Aライン
      tags:
        A-line dress, above knee length dress, round neck, sleeveless, empire waist, buttons, loose fit, casual, earth colors: Aラインの膝上丈ワンピース。ラウンドネックにノースリーブ、エンパイアウエストとボタン装飾を備えた、ゆったりとしたカジュアルなアースカラーの一着。
        A-line dress, muted color, midi length dress, square neckline, long sleeves, bishop sleeves, high waist, pleats, elegant: Aラインのミディ丈ワンピース。落ち着いたカラーで、スクエアネックラインにロングスリーブとビショップスリーブ、高めのウエスト位置とプリーツを備えた、上品な一着。
    - name: シルエット / タイト
      tags:
        bodycon dress, long length dress, slitting, cowl neck, long sleeves, flared sleeves, loose fit, casual, earth tones: ボディコンシルエットのロング丈ワンピース。スリット入りで、カウルネックにロングスリーブとフレア袖を備えた、ゆったりとしたカジュアルなアーストーンの一着。
        bodycon dress, midi length dress, sweetheart neckline, long sleeves, lace trim, high waist, formal, dark color: ボディコンシルエットのミディ丈ワンピース。スイートハートネックラインにロングスリーブ、レース装飾と高めのウエスト位置を備えた、フォーマルなダークカラーの一着。
        tight dress, knee length, V-neck, sleeveless, high waist, belt, slim fit, elegant, dark colors: タイトシルエットの膝丈ワンピース。Vネックにノースリーブ、高めのウエスト位置とベルトを備えた、細身で上品なダークカラーの一着。
        tight dress, micro length dress, round neck, sleeveless, high waist, ribbed, slim fit, casual, earth colors: タイトシルエットのマイクロ丈ワンピース。ラウンドネックにノースリーブ、高めのウエスト位置とリブ素材の質感を備えた、細身でカジュアルなアースカラーの一着。
        tight dress, vivid color, short length dress, halter neckline, sleeveless, low waist, belt, feminine: タイトシルエットの鮮やかなカラーショート丈ワンピース。ホルターネックラインにノースリーブ、ローウエストとベルトを備えた、フェミニンな一着。
    - name: シルエット / フレア
      tags:
        flare dress, earth color, knee length dress, U-neckline, half sleeves, bell sleeves, empire waist, buttons, feminine: フレアシルエットの膝丈ワンピース。アースカラーで、Uネックラインにハーフスリーブとベルスリーブ、エンパイアウエストとボタン装飾を備えた、フェミニンな一着。
        flare dress, warm color, tea length, U-neckline, sleeveless, low waist, layered dress, ruffles, girly: フレアシルエットのティー丈ワンピース。暖色系カラーで、Uネックラインにノースリーブ、ローウエストとレイヤード仕様、ラッフルを備えた、ガーリーな一着。
    - name: シルエット / マーメイド
      tags:
