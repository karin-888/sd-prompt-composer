        camisole dress, above knee length dress, high waist, belt, casual, dark colors, layered dress: キャミワンピースの膝上丈ワンピース。高めのウエスト位置とベルトを備えた、レイヤード仕様のカジュアルなダークカラーの一着。
        camisole dress, ankle length dress, cotton, lace trim, high waist, gathered waist, casual, white color: キャミワンピースのアンクル丈ワンピース。コットン素材で、レース装飾と高めのウエスト位置、ギャザーウエストを備えた、白色のカジュアルな一着。
