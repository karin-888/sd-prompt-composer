        mermaid silhouette dress, midi length dress, round neck, long sleeves, raglan sleeves, gathered waist, casual, loose fit: マーメイドシルエットのミディ丈ワンピース。ラウンドネックにロングスリーブとラグランスリーブ、ギャザーウエストを備えた、ゆったりしたカジュアルな一着。
        mermaid silhouette dress, midi length dress, round neck, short sleeves, gathered waist, casual, loose fit: マーメイドシルエットのミディ丈ワンピース。ラウンドネックにショートスリーブ、ギャザーウエストを備えた、ゆったりしたカジュアルな一着。
