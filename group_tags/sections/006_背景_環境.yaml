        night_city_lights_through_train_window, train_interior: ネオンや街灯が輝く夜景。都会の煌びやかさやムーディな雰囲気を強調できる。
        snow-covered_landscape_through_train_window, train_interior: 雪に覆われた田舎や山村。静寂感や凛とした冬景色。
        subway_tunnel_through_train_window, train_interior: コンクリート壁やトンネルライトが連続する地下鉄の動線を描写。都市地下空間の雰囲気を強調できる。
